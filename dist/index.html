<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nusa Studio - Studio kreatif independen yang merancang website landing page premium dengan sentuhan alam untuk bisnis kecil dan kreator lokal.">
  <meta name="theme-color" content="#0c0f14">
  <meta property="og:title" content="Nusa Studio - Website Premium Studio">
  <meta property="og:description" content="Website yang tenang, tajam, dan mudah dipercaya untuk bisnis kecil dan kreator lokal.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%23d4a574'/><stop offset='100%25' stop-color='%23e8c9a8'/></linearGradient></defs><rect fill='%230c0f14' width='100' height='100' rx='16'/><path d='M50 20 C30 20 25 35 25 50 C25 70 50 85 50 85 C50 85 75 70 75 50 C75 35 70 20 50 20' fill='url(%23g)'/></svg>">
  <title>Nusa Studio — Studio Kreatif Independen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0c0f14;
      --color-bg-deep: #080a0d;
      --color-bg-secondary: #13161d;
      --color-bg-elevated: #1a1e27;
      --color-bg-card: #151820;
      --color-text: #f4f4f5;
      --color-text-muted: #a1a1aa;
      --color-text-subtle: #71717a;
      --color-gold: #d4a574;
      --color-gold-light: #e8c9a8;
      --color-gold-warm: #c49a6c;
      --color-gold-glow: rgba(212, 165, 116, 0.4);
      --color-sage: #8b9a7d;
      --color-sage-light: #a8b89d;
      --color-terracotta: #c17f59;
      --color-sand: #c9b896;
      --color-gradient-premium: linear-gradient(135deg, #d4a574 0%, #c49a6c 25%, #8b9a7d 50%, #c9b896 75%, #d4a574 100%);
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, sans-serif;
      --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-slow: cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;

    /* ==================== VINE LEAF DECORATIONS ==================== */
    .vine-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .vine {
      position: absolute;
      width: 100px;
      height: 100vh;
    }

    .vine-left {
      left: 0;
      top: 0;
    }

    .vine-right {
      right: 0;
      top: 0;
      transform: scaleX(-1);
    }

    .vine-svg {
      width: 100%;
      height: 100%;
    }

    .vine-path {
      fill: none;
      stroke: var(--color-sage);
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0.2;
      filter: drop-shadow(0 0 2px rgba(139, 154, 125, 0.2));
    }

    .vine-path-gold {
      fill: none;
      stroke: var(--color-gold);
      stroke-width: 1;
      stroke-linecap: round;
      opacity: 0.15;
      filter: drop-shadow(0 0 1px rgba(212, 165, 116, 0.2));
    }

    .leaf {
      transform-origin: center;
      fill: var(--color-sage);
      opacity: 0.25;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
    }

    .leaf-gold {
      fill: var(--color-gold-light);
      opacity: 0.2;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
    }

    .leaf-1 { animation: leaf-sway 4s ease-in-out infinite; transform-origin: 50% 0%; }
    .leaf-2 { animation: leaf-sway 5s ease-in-out infinite reverse; transform-origin: 50% 0%; }
    .leaf-3 { animation: leaf-sway 3.5s ease-in-out infinite 0.5s; transform-origin: 50% 0%; }
    .leaf-4 { animation: leaf-sway 4.5s ease-in-out infinite 1s; transform-origin: 50% 0%; }
    .leaf-5 { animation: leaf-sway 3s ease-in-out infinite 0.3s; transform-origin: 50% 0%; }

    @keyframes leaf-sway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .vine-glow {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 154, 125, 0.05) 0%, transparent 70%);
      filter: blur(20px);
      animation: glow-pulse 6s ease-in-out infinite;
    }

    .vine-glow-1 { top: 10%; left: -30px; animation-delay: 0s; }
    .vine-glow-2 { top: 40%; left: -30px; animation-delay: 2s; }
    .vine-glow-3 { top: 70%; left: -30px; animation-delay: 4s; }
    .vine-glow-4 { top: 25%; right: -30px; animation-delay: 1s; }
    .vine-glow-5 { top: 55%; right: -30px; animation-delay: 3s; }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }

    /* Scroll animation for vines */
    .vine-left {
      animation: vine-scroll-left 1s ease-out forwards;
    }

    .vine-right {
      animation: vine-scroll-right 1s ease-out forwards;
    }

    @keyframes vine-scroll-left {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes vine-scroll-right {
      from { transform: scaleX(-1) translateX(-100%); opacity: 0; }
      to { transform: scaleX(-1) translateX(0); opacity: 1; }
    }

    /* 3D Leaf depth effect */
    .leaf-3d {
      position: relative;
      transform-style: preserve-3d;
    }

    .leaf-3d::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
      border-radius: inherit;
    }

    /* Falling leaves animation */
    .falling-leaf {
      position: fixed;
      width: 20px;
      height: 20px;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: falling 15s linear infinite;
    }

    .falling-leaf svg {
      width: 100%;
      height: 100%;
    }

    .falling-leaf-1 { left: 10%; animation-delay: 0s; }
    .falling-leaf-2 { left: 25%; animation-delay: 3s; }
    .falling-leaf-3 { left: 45%; animation-delay: 7s; }
    .falling-leaf-4 { left: 70%; animation-delay: 11s; }
    .falling-leaf-5 { left: 85%; animation-delay: 5s; }

    @keyframes falling {
      0% {
        transform: translateY(-100px) rotate(0deg) translateX(0);
        opacity: 0;
      }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% {
        transform: translateY(100vh) rotate(360deg) translateX(100px);
        opacity: 0;
      }
    }

    .falling-leaf:nth-child(odd) {
      animation-name: falling-alt;
    }

    @keyframes falling-alt {
      0% {
        transform: translateY(-100px) rotate(0deg) translateX(0);
        opacity: 0;
      }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% {
        transform: translateY(100vh) rotate(-360deg) translateX(-100px);
        opacity: 0;
      }
    }

    /* Responsive vine hide on mobile */
    @media (max-width: 1024px) {
      .vine-container {
        opacity: 0.5;
      }
      .vine {
        width: 80px;
      }
    }

    @media (max-width: 768px) {
      .vine-container {
        display: none;
      }
    }

    /* ==================== STATS SECTION ==================== */
    .stats {
      background: linear-gradient(180deg, var(--color-bg-secondary) 0%, var(--color-bg) 100%);
      padding: 6rem 0;
      position: relative;
      overflow: hidden;
    }

    .stats::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(212, 165, 116, 0.3), transparent);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem;
    }

    .stat-item {
      text-align: center;
      padding: 2rem;
      position: relative;
    }

    .stat-item::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 1px;
      height: 60%;
      background: linear-gradient(to bottom, transparent, rgba(212, 165, 116, 0.3), transparent);
    }

    .stat-item:last-child::after {
      display: none;
    }

    .stat-number {
      font-family: var(--font-heading);
      font-size: 4rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-sage) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ==================== ABOUT SECTION ==================== */
    .about {
      padding: 10rem 0;
      position: relative;
    }

    .about-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: center;
    }

    .about-image {
      position: relative;
      aspect-ratio: 4/5;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(135deg, var(--color-bg-elevated) 0%, var(--color-bg-card) 100%);
      border: 1px solid rgba(212, 165, 116, 0.1);
    }

    .about-image::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 30% 30%, rgba(139, 154, 125, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 70% 70%, rgba(212, 165, 116, 0.1) 0%, transparent 50%);
    }

    .about-image-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 8rem;
      color: var(--color-gold);
      opacity: 0.3;
    }

    .about-image-decoration {
      position: absolute;
      bottom: -20px;
      right: -20px;
      width: 150px;
      height: 150px;
      border: 2px solid rgba(212, 165, 116, 0.2);
      border-radius: 24px;
      transform: rotate(6deg);
    }

    .about-content h2 {
      font-family: var(--font-heading);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }

    .about-content h2 span {
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-sage) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .about-content p {
      font-size: 1.0625rem;
      color: var(--color-text-muted);
      line-height: 1.85;
      margin-bottom: 1.5rem;
    }

    .about-features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 2rem;
    }

    .about-feature {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--color-bg-elevated);
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--color-text-muted);
    }

    .about-feature-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-warm) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .about-feature-icon svg {
      width: 12px;
      height: 12px;
      color: var(--color-bg);
    }

    /* ==================== TESTIMONIALS SECTION ==================== */
    .testimonials {
      padding: 10rem 0;
      background: var(--color-bg-secondary);
      position: relative;
      overflow: hidden;
    }

    .testimonials::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(212, 165, 116, 0.3), transparent);
    }

    .testimonials::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(212, 165, 116, 0.3), transparent);
    }

    .testimonials-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 4rem;
    }

    .testimonial-card {
      background: var(--color-bg-card);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 2.5rem;
      position: relative;
      transition: all 0.4s var(--transition-smooth);
    }

    .testimonial-card:hover {
      transform: translateY(-8px);
      border-color: rgba(212, 165, 116, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    .testimonial-quote {
      font-family: var(--font-heading);
      font-size: 4rem;
      color: var(--color-gold);
      opacity: 0.3;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .testimonial-text {
      font-size: 1rem;
      color: var(--color-text-muted);
      line-height: 1.8;
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    .testimonial-author {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .testimonial-avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-sage) 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 1.25rem;
      color: var(--color-bg);
      font-weight: 600;
    }

    .testimonial-info h4 {
      font-family: var(--font-heading);
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .testimonial-info span {
      font-size: 0.8125rem;
      color: var(--color-text-subtle);
    }

    .testimonial-stars {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1rem;
    }

    .testimonial-stars svg {
      width: 16px;
      height: 16px;
      fill: var(--color-gold);
    }

    /* ==================== CTA SECTION ==================== */
    .cta {
      padding: 8rem 0;
      position: relative;
      overflow: hidden;
    }

    .cta-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 100% 80% at 50% 50%, rgba(212, 165, 116, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 30% 50%, rgba(139, 154, 125, 0.08) 0%, transparent 50%),
        var(--color-bg);
    }

    .cta-content {
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .cta-content h2 {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }

    .cta-content h2 span {
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-sage) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cta-content p {
      font-size: 1.125rem;
      color: var(--color-text-muted);
      max-width: 600px;
      margin: 0 auto 2.5rem;
      line-height: 1.8;
    }

    .cta-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 1024px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat-item:nth-child(2)::after {
        display: none;
      }

      .about-wrapper {
        grid-template-columns: 1fr;
        gap: 3rem;
      }

      .about-image {
        max-width: 500px;
        margin: 0 auto;
      }

      .testimonials-grid {
        grid-template-columns: 1fr;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    @media (max-width: 768px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .stat-item::after {
        display: none;
      }

      .stat-number {
        font-size: 3rem;
      }

      .about-features {
        grid-template-columns: 1fr;
      }

      .cta-buttons {
        flex-direction: column;
      }
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: 1.75;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: linear-gradient(135deg, var(--color-gold), var(--color-sage));
      color: var(--color-bg);
    }

    /* Premium Grain Texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 9999;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: var(--color-bg-deep);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--color-gold-warm), var(--color-bg-elevated));
      border-radius: 5px;
      border: 2px solid var(--color-bg-deep);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--color-gold), var(--color-gold-warm));
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2.5rem;
    }

    /* ==================== HEADER ==================== */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.75rem 0;
      transition: all 0.5s var(--transition-slow);
    }

    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 15, 20, 0.8) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.5s var(--transition-smooth);
    }

    .header.scrolled::before {
      opacity: 1;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(12, 15, 20, 0.85);
      border-bottom: 1px solid rgba(212, 165, 116, 0.08);
    }

    .header-inner {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--color-text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-sage) 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      color: var(--color-bg);
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(212, 165, 116, 0.3);
      position: relative;
      overflow: hidden;
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 3.5rem;
    }

    .nav-link {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-text-muted);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      position: relative;
      padding: 0.5rem 0;
      transition: color 0.4s var(--transition-smooth);
    }

    .nav-link::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 1px;
      background: var(--color-gradient-premium);
      transform: translateX(-50%);
      transition: width 0.4s var(--transition-smooth);
    }

    .nav-link:hover {
      color: var(--color-text);
    }

    .nav-link:hover::before {
      width: 100%;
    }

    /* ==================== BUTTONS ==================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      padding: 1rem 2rem;
      font-family: var(--font-body);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.4s var(--transition-smooth);
      border: none;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform 0.6s var(--transition-smooth);
    }

    .btn:hover::before {
      transform: translateX(100%);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-warm) 100%);
      color: var(--color-bg);
      box-shadow: 0 4px 24px rgba(212, 165, 116, 0.25), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(212, 165, 116, 0.35), inset 0 1px 0 rgba(255,255,255,0.2);
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-text);
      border: 1px solid rgba(244, 244, 245, 0.15);
      backdrop-filter: blur(8px);
    }

    .btn-secondary:hover {
      background: rgba(244, 244, 245, 0.05);
      border-color: rgba(244, 244, 245, 0.25);
      transform: translateY(-2px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s var(--transition-smooth);
    }

    .btn:hover svg {
      transform: translateX(4px);
    }

    /* ==================== HERO ==================== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 10rem 0 8rem;

    }

    /* Nature-inspired Background */
    .hero-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 100% 80% at 50% -10%, rgba(139, 154, 125, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse 80% 60% at 80% 30%, rgba(212, 165, 116, 0.12) 0%, transparent 40%),
        radial-gradient(ellipse 60% 50% at 20% 70%, rgba(193, 127, 89, 0.08) 0%, transparent 40%),
        radial-gradient(ellipse 100% 100% at 50% 100%, rgba(8, 10, 13, 0.8) 0%, transparent 50%),
        var(--color-bg);
    }

    /* Floating Organic Particles */
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, var(--color-gold-light) 0%, transparent 70%);
      border-radius: 50%;
      opacity: 0;
      animation: float-particle 12s ease-in-out infinite;
    }

    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .particle:nth-child(2) { left: 25%; top: 60%; animation-delay: 2s; }
    .particle:nth-child(3) { left: 45%; top: 30%; animation-delay: 4s; }
    .particle:nth-child(4) { left: 65%; top: 70%; animation-delay: 1s; }
    .particle:nth-child(5) { left: 80%; top: 25%; animation-delay: 3s; }
    .particle:nth-child(6) { left: 90%; top: 55%; animation-delay: 5s; }
    .particle:nth-child(7) { left: 15%; top: 80%; animation-delay: 6s; }
    .particle:nth-child(8) { left: 75%; top: 15%; animation-delay: 7s; }

    @keyframes float-particle {
      0%, 100% { 
        opacity: 0;
        transform: translateY(0) scale(0.5);
      }
      10% { opacity: 0.6; }
      50% { 
        opacity: 0.3;
        transform: translateY(-100px) scale(1);
      }
      90% { opacity: 0.6; }
    }

    /* Organic Wave Decoration */
    .wave-decoration {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      overflow: hidden;
      opacity: 0.15;
    }

    .wave-decoration svg {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 100%;
      animation: wave-flow 20s linear infinite;
    }

    .wave-decoration svg:nth-child(2) {
      animation-delay: -10s;
      opacity: 0.5;
    }

    @keyframes wave-flow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Golden Rings */
    .hero-decoration {
      position: absolute;
      border: 1px solid rgba(212, 165, 116, 0.08);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: breathe-ring 8s ease-in-out infinite;
    }

    .hero-decoration:nth-child(1) { width: 500px; height: 500px; }
    .hero-decoration:nth-child(2) { width: 700px; height: 700px; animation-delay: -2s; }
    .hero-decoration:nth-child(3) { width: 900px; height: 900px; animation-delay: -4s; }

    @keyframes breathe-ring {
      0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.15; transform: translate(-50%, -50%) scale(1.02); }
    }

    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 850px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 1.25rem;
      background: rgba(212, 165, 116, 0.08);
      border: 1px solid rgba(212, 165, 116, 0.2);
      border-radius: 100px;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-gold);
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeInUp 1s var(--transition-smooth) forwards;
    }

    .hero-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--color-gold);
      border-radius: 50%;
      animation: pulse-glow 2s ease-in-out infinite;
      box-shadow: 0 0 12px var(--color-gold-glow);
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 12px var(--color-gold-glow); }
      50% { transform: scale(1.2); opacity: 0.8; box-shadow: 0 0 20px var(--color-gold-glow); }
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(3.5rem, 9vw, 6rem);
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: fadeInUp 1s var(--transition-smooth) 0.2s forwards;
    }

    .hero-title .accent {
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-sand) 50%, var(--color-gold) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s ease-in-out infinite;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }

    .hero-title .line {
      display: block;
    }

    .hero-description {
      font-size: 1.1875rem;
      color: var(--color-text-muted);
      max-width: 580px;
      margin: 0 auto 3rem;
      line-height: 1.85;
      font-weight: 300;
      opacity: 0;
      animation: fadeInUp 1s var(--transition-smooth) 0.4s forwards;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeInUp 1s var(--transition-smooth) 0.6s forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scroll-indicator {
      position: absolute;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      color: var(--color-text-subtle);
      font-size: 0.6875rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeInUp 1s var(--transition-smooth) 1.2s forwards;
    }

    .scroll-indicator-line {
      width: 1px;
      height: 70px;
      background: linear-gradient(to bottom, var(--color-gold), var(--color-sage), transparent);
      position: relative;
    }

    .scroll-indicator-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 20px;
      background: linear-gradient(to bottom, var(--color-gold), transparent);
      animation: scroll-flow 2s ease-in-out infinite;
    }

    @keyframes scroll-flow {
      0%, 100% { transform: scaleY(1); opacity: 1; }
      50% { transform: scaleY(0.5); opacity: 0.5; }
    }

    /* ==================== SECTIONS ==================== */
    .section {
      padding: 10rem 0;
      position: relative;
      z-index: 5;
    }

    .section-header {
      text-align: center;
      margin-bottom: 5rem;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--color-gold);
      margin-bottom: 1.5rem;
    }

    .section-label::before,
    .section-label::after {
      content: '';
      width: 50px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--color-gold));
    }

    .section-label::after {
      background: linear-gradient(to left, transparent, var(--color-gold));
    }

    .section-title {
      font-family: var(--font-heading);
      font-size: clamp(2.25rem, 5vw, 3.75rem);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
    }

    .section-subtitle {
      font-size: 1.125rem;
      color: var(--color-text-muted);
      max-width: 620px;
      margin: 0 auto;
      line-height: 1.8;
      font-weight: 300;
    }

    /* ==================== SERVICES ==================== */
    .services {
      background: var(--color-bg-secondary);
      position: relative;
      overflow: hidden;
    }

    .services::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--color-gold), var(--color-sage), transparent);
    }

    .services::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 300px;
      background: radial-gradient(ellipse 100% 100% at 50% 100%, rgba(139, 154, 125, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 2.5rem;
    }

    .service-card {
      background: var(--color-bg-card);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 3rem;
      transition: all 0.5s var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--color-gold), var(--color-sage), var(--color-gold));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s var(--transition-smooth);
    }

    .service-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(212, 165, 116, 0.06) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.5s var(--transition-smooth);
    }

    .service-card:hover {
      transform: translateY(-12px);
      border-color: rgba(212, 165, 116, 0.15);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 80px rgba(212, 165, 116, 0.05);
    }

    .service-card:hover::before {
      transform: scaleX(1);
    }

    .service-card:hover::after {
      opacity: 1;
    }

    .service-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, rgba(212, 165, 116, 0.12) 0%, rgba(139, 154, 125, 0.08) 100%);
      border: 1px solid rgba(212, 165, 116, 0.15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
      color: var(--color-gold);
      transition: all 0.5s var(--transition-smooth);
      position: relative;
      z-index: 1;
    }

    .service-card:hover .service-icon {
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-warm) 100%);
      color: var(--color-bg);
      transform: scale(1.1) rotate(-5deg);
      box-shadow: 0 8px 30px rgba(212, 165, 116, 0.3);
    }

    .service-icon svg {
      width: 30px;
      height: 30px;
    }

    .service-title {
      font-family: var(--font-heading);
      font-size: 1.625rem;
      font-weight: 600;
      margin-bottom: 1rem;
      position: relative;
      z-index: 1;
    }

    .service-description {
      font-size: 0.9375rem;
      color: var(--color-text-muted);
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }

    /* ==================== PROCESS ==================== */
    .process {
      position: relative;
      overflow: hidden;
    }

    .process::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(139, 154, 125, 0.06) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .process-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3rem;
      position: relative;
    }

    .process-grid::before {
      content: '';
      position: absolute;
      top: 80px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--color-gold), var(--color-sage), var(--color-gold), transparent);

    .process-step {

    .process-number {
      width: 140px;
      height: 140px;

    .process-number::before {
      content: '';

      inset: -12px;
      border: 1px dashed rgba(212, 165, 116, 0.2);
      border-radius: 50%;
      transition: all 0.5s var(--transition-smooth);
    }

    .process-number::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.1) 0%, transparent 60%);
    }

    .process-step:hover .process-number {
      background: linear-gradient(135deg, var(--color-gold) 0%, var(--color-gold-warm) 100%);

      box-shadow: 0 0 50px rgba(212, 165, 116, 0.3);

    .process-title {

    .process-description {

    /* ==================== FOOTER ==================== */
    .footer {
